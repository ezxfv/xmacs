# Optimized golangci-lint configuration for balanced performance and functionality
# Designed to minimize system load while maintaining effective code quality checks

# Analysis running options
run:
  # Reduce concurrency to prevent high CPU usage
  concurrency: 4

  # Shorter timeout to prevent long-running processes
  timeout: 5m

  # Exit code when issues found
  issues-exit-code: 1

  # Include test files
  tests: true

  # Skip directories to reduce analysis scope
  skip-dirs:
    - vendor
    - third_party
    - testdata
    - examples
    - Godeps
    - builtin
    - kitex_gen
    - thrift_gen
    - .git
    - node_modules

  # Use default skip directories
  skip-dirs-use-default: true

  # Allow parallel runners for better workflow integration
  allow-parallel-runners: true

# Output configuration
output:
  # Use simple format for faster processing
  format: colored-line-number

  # Reduce output verbosity
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: false  # Disable sorting for performance

# Severity configuration
severity:
  default-severity: error
  case-sensitive: false

# Linter settings - optimized for performance
linters-settings:
  # Reduce duplication threshold for faster analysis
  dupl:
    threshold: 150

  # Relaxed function length limits
  funlen:
    lines: 120
    statements: 60

  # Increase minimum length to reduce false positives
  goconst:
    min-len: 3
    min-occurrences: 3

  # Simplified gocritic settings
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - commentedOutCode
      - unnecessaryBlock

  # Increase complexity threshold
  gocyclo:
    min-complexity: 20

  # Simplified gomnd settings
  gomnd:
    checks:
      - argument
      - case
      - condition
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
      - '10'
      - '100'
      - '1000'

  # Basic govet settings
  govet:
    check-shadowing: false  # Disable for performance

  # Increase line length limit
  lll:
    line-length: 160

  # Basic misspell settings
  misspell:
    locale: US

  # Relaxed nolint settings
  nolintlint:
    allow-unused: true
    require-explanation: false
    require-specific: false

# Linters - carefully selected for performance
linters:
  disable-all: true
  enable:
    # Essential linters only
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examination
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - typecheck     # Type checking
    - unused        # Unused code detection
    - gofmt         # Format checking
    - goimports     # Import checking
    
    # Performance-friendly linters
    - gosec         # Security issues (lightweight)
    - unconvert     # Unnecessary conversions
    - misspell      # Spelling mistakes
    
    # Optional quality linters (lightweight)
    - goconst       # Repeated strings
    - whitespace    # Whitespace issues

  # Disabled for performance reasons:
  # - bodyclose     # Resource intensive
  # - depguard      # Can be slow on large codebases
  # - dupl          # Expensive duplicate detection
  # - funlen        # Function length analysis
  # - gochecknoinits # Init function checking
  # - gocritic      # Comprehensive but slow
  # - gocyclo       # Cyclomatic complexity
  # - gomnd         # Magic number detection
  # - lll           # Line length checking
  # - nakedret      # Naked return checking
  # - noctx         # Context checking
  # - stylecheck    # Style checking
  # - unparam       # Unused parameter detection

# Issues configuration
issues:
  # Exclude common false positives
  exclude-rules:
    # Ignore magic numbers in tests
    - path: _test\.go
      linters:
        - gomnd
        - goconst
    
    # Ignore line length in generated files
    - path: \.pb\.go$
      linters:
        - lll
    
    # Ignore certain issues in vendor directories
    - path: vendor/
      linters:
        - all

  # Limit maximum issues to prevent overwhelming output
  max-issues-per-linter: 50
  max-same-issues: 10

  # Don't skip warning severity issues
  exclude-use-default: false

  # Show only new issues in diff mode
  new: false

  # Fix found issues if possible
  fix: false
